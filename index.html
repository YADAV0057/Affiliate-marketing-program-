<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mood Store — Become a Partner</title>
<link rel="stylesheet" href="css/portal.css" />
</head>
<body>

<header class="portal-header">
  <div class="portal-brand">Mood Store <small>Partners</small></div>
</header>
<div class="torn-divider"></div>

<nav class="tab-bar">
  <a href="index.html" class="tab-link active">Browse</a>
  <a href="auth.html" class="tab-link tab-link-btn" id="authNavLink">Sign in</a>
</nav>

<main class="portal-main">
  <p class="section-eyebrow">Creator partner program</p>
  <h1 class="section-title mt-0">Promote what you love. Earn on every sale.</h1>
  <p class="auth-note mb-lg">Browse the catalogue below — no account needed. Found something you want to promote? Click it, and we'll get you set up.</p>

  <div id="catalogueList" class="product-grid">
    <p class="state-msg">Loading products…</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/catalogue.js"></script>

</body>
</html>
