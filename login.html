<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="refresh" content="0; url=auth.html" />
<title>Redirecting — Mood Store Partners</title>
<link rel="stylesheet" href="css/portal.css" />
</head>
<body>
<!--
  2026-08-30: sign-in and apply were merged into one page (auth.html) —
  a separate login.html no longer makes sense to maintain, since the
  unified page figures out new-vs-returning on its own after the person
  verifies. This stub only exists to catch old bookmarks/links; it
  redirects immediately via both a meta-refresh and a script fallback, and
  carries along any query params (e.g. a lingering ?promote= slug) so
  nothing already in flight breaks.
-->
<script>
  window.location.replace("auth.html" + window.location.search);
</script>
<main class="auth-shell">
  <p class="auth-note">Taking you to the sign-in page… <a href="auth.html">Continue</a></p>
</main>
</body>
</html>
